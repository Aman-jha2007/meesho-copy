<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playwrite+DE+LA+Guides&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="meesho.css">
    <title>Messho App</title>
</head>
<body>
    <div class="meesho">
        <div class="header">
            <img src="meeshoLogo.svg" class="header-img">
            <div class="header-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Try Saree, Kurti or Search by Product Code">
            </div>
            <a href="#supplier">Become a Supplier</a>
            <a href="#investor">Investor Relations</a>
            <div class="header-profile">
                <i class="fa-regular fa-user"></i>
                <a href="#profile">Profile</a>
            </div>
            <div class="header-cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <a href="#cart">Cart</a>
            </div>
        </div>
        <hr>
        <div></div>
        <div></div>
        <div></div>
    </div>


    <script src="meesho.js"></script>
</body>
</html>
